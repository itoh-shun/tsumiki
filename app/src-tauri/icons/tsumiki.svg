<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- tsumiki アプリアイコン（正本）。
       ここから `pnpm tauri icon` で各サイズを生成する。形を変えるときはこの
       ファイルを直し、生成し直すこと。生成物を直接編集しない。

       DESIGN.md §4 の積層バーと同じモチーフだが、比率は揃えない。
       積層バーは「受信に何件積まれているか」を示す計器で段数が変わる。
       アイコンは銘で、常に同じ形。24x8px の横長ブロックを縦に並べた形は
       32px のトレイ表示でハンバーガーメニューに見えるため、下2つ・上1つの
       積み木にしてある。色は DESIGN.md §2 から引く。 -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <g>
    <!-- 下段2つは淡く、上に載る1つだけアクセント塗り。 -->
    <rect x="92"  y="290" width="150" height="150" rx="36" fill="#c4bdb5"/>
    <rect x="270" y="290" width="150" height="150" rx="36" fill="#d8d2ca"/>
    <rect x="181" y="112" width="150" height="150" rx="36" fill="#d98324"/>
  </g>
</svg>
